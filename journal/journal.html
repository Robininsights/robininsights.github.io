        :root {

            --font-data: 'JetBrains Mono', monospace;

        [data-theme="dark"] {
            --bg-app:linear-gradient(135deg, #210718 0%, #040506 100%);
            --bg-panel:rgb(34 34 34 / 85%);

            --color-up: #34d399;

            --row-even: rgba(255, 255, 255, 0.03);
            --row-odd: transparent;
            --sl-bg: rgba(239, 68, 68, 0.25);

        body {

            transition: background 0.3s ease;
