    <style>
        :root {
            --bg-app:linear-gradient(135deg, #ffffff 0%, #e6c3ff 100%); 
            --bg-panel: rgba(255, 255, 255, 0.75);
            --bg-header: rgba(255, 255, 255, 0.85);
            --bg-selector: #fff;
            --border-color: rgba(0, 0, 0, 0.08);
            --shadow-soft: 0 8px 32px rgba(31, 38, 135, 0.1);
            --shadow-card: 0 10px 30px -5px rgba(0,0,0,0.08);
            --shadow-hover: 0 20px 40px -5px rgba(0,0,0,0.12);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --color-up: #059669;
            --color-down: #dc2626;
            --accent-blue: #2563eb;
            --th-bg: #d7d7d7;
            --th-text: #000000;
            --row-even: rgba(255, 255, 255, 0.3);
            --row-odd: transparent;
            --sl-bg: rgba(239, 68, 68, 0.15);            
            --ease-snappy: cubic-bezier(0.2, 0.8, 0.2, 1);
            --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-data: 'JetBrains Mono', monospace;
        }

        [data-theme="dark"] {
            --bg-app:linear-gradient(135deg, #210718 0%, #040506 100%);
            --bg-panel:rgb(34 34 34 / 85%);
            --bg-header: rgba(30, 41, 59, 0.95);
            --bg-selector: #2e2e2e;
            --border-color: rgba(255, 255, 255, 0.1);
            --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.3);
            --shadow-card: 0 10px 30px -5px rgba(0,0,0,0.3);
            --shadow-hover: 0 20px 40px -5px rgba(0,0,0,0.4);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --color-up: #34d399;
            --color-down: #f87171;
            --accent-blue: #60a5fa;
            --th-bg: #334155;
            --th-text: #f1f5f9;
            --row-even: rgba(255, 255, 255, 0.03);
            --row-odd: transparent;
            --sl-bg: rgba(239, 68, 68, 0.25);
        }

        body {
            background: var(--bg-app);
            color: var(--text-primary);
            font-family: var(--font-ui);
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            -webkit-font-smoothing: antialiased;
            transition: background 0.3s ease;
        }
    </style>
</head>
